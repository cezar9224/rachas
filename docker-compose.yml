services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rachas
      POSTGRES_USER: rachas
      POSTGRES_PASSWORD: rachas
    ports:
      - "5432:5432"
    volumes:
      - rachas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rachas -d rachas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rachas_postgres_data:
